x-app: &app
  build:
    context: .
    args:
      SHADOWLAB_COMMIT: ${SHADOWLAB_COMMIT:-}
  environment: &env
    DATABASE_URL: postgres://shadowlab:local-history@postgres/shadowlab
    S3_ENDPOINT: http://objects:8333
    AWS_ACCESS_KEY_ID: shadowlab-local
    AWS_SECRET_ACCESS_KEY: shadowlab-local-secret
    S3_BUCKET: shadowlab
  depends_on:
    postgres: { condition: service_healthy }
    objects: { condition: service_started }
  networks: [storage]
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadowlab
      POSTGRES_PASSWORD: local-history
      POSTGRES_DB: shadowlab
    volumes: [history-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shadowlab"]
      interval: 2s
      timeout: 3s
      retries: 25
    networks: [storage]
  objects:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: mini -dir=/data -ip=objects -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: shadowlab-local
      AWS_SECRET_ACCESS_KEY: shadowlab-local-secret
      S3_BUCKET: shadowlab
    volumes: [history-objects:/data]
    networks: [storage]
  worker:
    <<: *app
    command: ["node", "apps/worker/main.ts"]
    restart: on-failure
    deploy:
      replicas: 2
  dashboard:
    <<: *app
    command: ["node", "apps/dashboard/server.ts"]
    environment:
      <<: *env
      HOST: 0.0.0.0
      PORT: 4200
    ports: ["127.0.0.1:4200:4200"]
    networks: [storage, viewer]
networks:
  storage: { internal: true }
  viewer: {}
volumes:
  history-db: {}
  history-objects: {}
