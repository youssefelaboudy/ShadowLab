name: Replay verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run coverage
      - run: node tools/check-repeatability.ts
      - run: npm run demo -- --out artifacts/demo
      - name: Exercise the container boundary and regression exit code
        shell: bash
        run: |
          docker compose up --wait --build
          rc=0
          docker compose exec -T baseline node packages/cli/main.ts replay --baseline http://127.0.0.1:4101 --candidate http://127.0.0.1:4102 --out /tmp/evidence || rc=$?
          test "$rc" -eq 1
          docker compose cp baseline:/tmp/evidence artifacts/compose
          node -e "const r=require('./artifacts/compose/report.json');if(r.first!=='summary')process.exit(1)"
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        with:
          name: replay-evidence
          path: artifacts/
          retention-days: 14
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHADOWLAB_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: docker compose -f compose.history.yaml up -d --build --wait
      - run: curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:4200/api/history
      - run: docker compose -f compose.history.yaml exec -T -e SHADOWLAB_DISPOSABLE_TEST=1 dashboard node tools/history-smoke.ts
      - run: docker compose -f compose.history.yaml exec -T -e 'PGOPTIONS=-c search_path=queue_test' dashboard node tools/queue-smoke.ts
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test tests/browser/dashboard.spec.ts --timeout 90000 --workers=1
      - if: failure()
        run: docker compose -f compose.history.yaml logs --tail 60
      - if: always()
        run: docker compose -f compose.history.yaml down -v
  revisions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Replay the tagged source-level defect
        run: |
          rc=0
          node packages/cli/main.ts revisions --baseline-ref demo/baseline-v2 --candidate-ref demo/stale-v2 --scenario scenarios/coupon-quantity.yaml --out artifacts/tagged || rc=$?
          test "$rc" -eq 1
          node -e "const r=require('./artifacts/tagged/report.json'); if(r.first!=='summary'||r.baselineCommit===r.candidateCommit)process.exit(1)"
      - name: Gate the proposed source revision
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          node packages/cli/main.ts revisions --baseline-ref "$BASE" --candidate-ref "$HEAD" --scenario scenarios/coupon-quantity.yaml --out artifacts/pr || rc=$?
          if [ "$rc" -eq 1 ]; then node tools/annotate.ts artifacts/pr/report.json scenarios/coupon-quantity.yaml; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-revision-evidence
          path: artifacts/
          retention-days: 14
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Start two developer-owned test targets
        run: |
          PORT=4101 SHADOWLAB_MODE=baseline node apps/demo-api/server.ts > /tmp/base.log 2>&1 &
          PORT=4102 SHADOWLAB_MODE=stale node apps/demo-api/server.ts > /tmp/candidate.log 2>&1 &
          for p in 4101 4102; do curl -s --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:$p/ >/dev/null; done
      - uses: ./
        id: seeded
        continue-on-error: true
        with:
          scenario: scenarios/coupon-quantity.yaml
          targets: config/targets.json
          out: artifacts/consumer
      - name: Verify seeded regression failed the action
        env:
          RESULT: ${{ steps.seeded.outcome }}
        run: test "$RESULT" = failure && node -e "if(require('./artifacts/consumer/report.json').first!=='summary')process.exit(1)"
      - uses: ./
        with:
          scenario: scenarios/quantity-before-coupon.json
          targets: config/targets.json
          out: artifacts/control


